<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" id="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>勇氣超人 Brave Guy</title>
<link rel="icon" type="image/webp" href="assets/runtime/pic/branding/favicon.webp">
<link rel="apple-touch-icon" href="assets/source/pic/branding/icon_01_logo.png">
<link rel="stylesheet" href="css/game.css?v=20261114b">
<link rel="modulepreload" href="js/world.js">
<link rel="modulepreload" href="js/visuals.js">
<link rel="modulepreload" href="js/fx.js">
<link rel="modulepreload" href="js/input.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/story.js">
<link rel="preload" href="assets/fonts/huninn-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/notosanstc-black-subset.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" hidden>
  <div class="hud-top-left">
    <div class="portrait" id="portrait"></div>
    <div class="bars">
      <div class="bar hp"><i id="hp-fill"></i><b id="hp-text"></b></div>
      <div class="bar courage" id="courage"><i id="courage-fill"></i><b data-i18n="勇氣">勇氣</b></div>
      <div class="bar guilt" id="guilt"><i id="guilt-fill"></i><b data-i18n="罪惡感">罪惡感</b></div>
    </div>
  </div>

  <canvas id="minimap" width="240" height="240" aria-hidden="true"></canvas>

  <div class="hud-top-right">
    <button class="icon-btn" id="btn-mute" aria-label="靜音"></button>
    <button class="icon-btn" id="btn-pause" aria-label="暫停"></button>
  </div>

  <div class="quest">
    <h3 id="quest-title" data-i18n="任務">任務</h3>
    <p id="quest-wave" data-i18n="打倒心魔">打倒心魔</p>
    <p id="quest-count">擊倒 0</p>
    <p id="suanle" hidden><span data-i18n="本月算了次數">本月算了次數</span> <b id="suanle-n">0</b></p>
    <p id="music-loading" hidden data-i18n="♪ 音樂載入中…">♪ 音樂載入中…</p>
  </div>

  <div class="combo" id="combo" hidden><b id="combo-n">0</b><span data-i18n="連擊">連擊</span></div>

  <div class="boss-bar" id="boss-bar" hidden>
    <span id="boss-name"></span>
    <div class="bar boss"><i id="boss-fill"></i></div>
  </div>

  <div id="banner" class="banner"></div>
  <div id="world-ui"></div>
  <div id="angel-bubble" class="bubble" hidden></div>


  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>

  <div class="actions">
    <button class="act skill s3" data-action="skill3" data-key="R" aria-label="氣功震地"><span data-i18n="震">震</span><em></em></button>
    <button class="act skill s2" data-action="skill2" data-key="E" aria-label="氣功彈"><span data-i18n="彈">彈</span><em></em></button>
    <button class="act skill s1" data-action="skill1" data-key="Q" aria-label="勇氣衝拳"><span data-i18n="衝">衝</span><em></em></button>
    <button class="act ult" data-action="ult" data-key="F" aria-label="超勇氣波"><span data-i18n="波">波</span><em></em></button>
    <button class="act lock" id="btn-lock" data-key="T" aria-label="自動鎖定" aria-pressed="false"><span data-i18n="鎖">鎖</span></button>
    <button class="act transform" data-action="transform" data-key="空白鍵" data-i18n-key="空白鍵" aria-label="變身"><span data-i18n="變身">變身</span></button>
    <button class="act dodge" data-action="dodge" data-key="右鍵" data-i18n-key="右鍵" aria-label="閃避"><span data-i18n="閃">閃</span><em></em></button>
    <button class="act attack" data-action="attack" data-key="左鍵" data-i18n-key="左鍵" aria-label="攻擊"><span data-i18n="拳">拳</span></button>
  </div>
</div>

<div id="dialog" class="dialog" hidden>
  <div class="dlg-box">
    <b id="dlg-name"></b>
    <p id="dlg-text"></p>
    <span class="dlg-next">▼</span>
    <button id="dlg-skip" data-i18n="跳過">跳過</button>
  </div>
</div>

<div id="pause-menu" class="overlay pause" hidden>
  <div class="card">
    <h1 data-i18n="暫　停">暫　停</h1>
    <button id="pm-resume" data-i18n="繼續">繼續</button>
    <button id="pm-restart" class="ghost" data-i18n="重新開始這一關">重新開始這一關</button>
    <button id="pm-menu" class="ghost" data-i18n="回標題／選關">回標題／選關</button>
    <button class="ghost lang-btn" data-lang-toggle>🌐 English</button>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="card">
    <img id="ov-logo" class="logo" src="assets/runtime/pic/branding/logo_01.webp" width="768" height="512" alt="勇氣超人 Brave Guy">
    <h1 id="ov-title" hidden></h1>
    <p id="ov-text"></p>
    <div class="loadbar" id="loadbar"><i id="loadbar-fill"></i></div>
    <p id="loadbar-text" class="muted">讀取中　0%</p>
    <p id="ov-load" class="muted"></p>
    <button id="ov-btn" disabled>開始</button>
    <button id="ov-next" hidden data-i18n="下一關">下一關</button>
    <button id="ov-menu" class="ghost" hidden data-i18n="選關">選關</button>
    <div id="ov-diff" class="diff-row" hidden></div>
    <div id="ov-stages" hidden></div>
    <button id="ov-easy" class="ghost" hidden data-i18n="調簡單一點（不丟臉，她只會笑你三天）">調簡單一點（不丟臉，她只會笑你三天）</button>
    <button class="ghost lang-btn" data-lang-toggle>🌐 English</button>
    <a class="back" href="../" data-i18n="← 回遊戲中心">← 回遊戲中心</a>
  </div>
</div>

<script>
// 讀取進度條與錯誤提示。這段不依賴模組，所以主程式還沒下載完就能顯示。
(function () {
  var note = document.getElementById('ov-load');
  var bar = document.getElementById('loadbar'), fill = document.getElementById('loadbar-fill'), label = document.getElementById('loadbar-text');
  var pct = 0, failed = false;

  // 進度只會往前，不會倒退
  window.__progress = function (value, text) {
    if (failed) return;
    pct = Math.max(pct, Math.min(100, value));
    fill.style.width = pct + '%';
    label.textContent = (text || '讀取中') + '　' + Math.round(pct) + '%';
    if (pct >= 100) setTimeout(function () { bar.hidden = true; label.hidden = true; }, 400);
  };

  // 3%–55%：3D 引擎（最大的檔案，佔全部程式的九成）。邊下載邊依實際位元組數推進。
  // 下載完才載入主程式；主程式匯入同一個網址時會直接用瀏覽器快取，不會重抓。
  var ENGINE = 'vendor/three/three.module.min.js', ENGINE_BYTES = 691648;
  function startGame() {
    var s = document.createElement('script');
    s.type = 'module';
    s.src = 'js/main.js?v=20261114b';
    document.body.appendChild(s);
  }
  window.__progress(3, '開始讀取');
  (function loadEngine() {
    if (!window.fetch || !window.ReadableStream) { startGame(); return; }
    fetch(ENGINE).then(function (res) {
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      var reader = res.body.getReader(), got = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          got += r.value.length;
          window.__progress(3 + Math.min(1, got / ENGINE_BYTES) * 52, '下載 3D 引擎');
          return pump();
        });
      })();
    }).then(function () { window.__progress(55, '下載遊戲程式'); startGame(); })
      .catch(function () { startGame(); }); // 進度抓不到也照樣啟動，讓模組載入自己處理錯誤
  })();

  // 55%–60%：其餘的小檔案，每下載完一個前進一格
  var files = ['main.js', 'i18n.js', 'lang_en.js', 'world.js', 'visuals.js', 'fx.js', 'input.js', 'audio.js', 'story.js'];
  var done = {};
  function seen(url) {
    for (var i = 0; i < files.length; i++) {
      if (url.indexOf('/' + files[i]) !== -1 && !done[files[i]]) {
        done[files[i]] = true;
        if (done['main.js']) window.__progress(55 + Object.keys(done).length / files.length * 5, '下載遊戲程式');
      }
    }
  }
  try {
    new PerformanceObserver(function (list) { list.getEntries().forEach(function (e) { seen(e.name); }); }).observe({ type: 'resource', buffered: true });
  } catch (err) { /* 不支援就只顯示主程式回報的進度 */ }

  // 出問題時要讓玩家看得到原因，而不是永遠停在讀取中
  window.__fail = function (html) {
    if (window.__booted) return;
    failed = true;
    bar.hidden = true; label.hidden = true;
    note.innerHTML = html + '<br><a href="#" id="ov-reload" style="color:#f6c21c">重新載入</a>';
    note.style.opacity = 1;
    document.getElementById('ov-reload').onclick = function (e) { e.preventDefault(); location.replace(location.pathname + '?r=' + Date.now()); };
  };
  window.addEventListener('error', function (e) { if (!failed) window.__fail('載入失敗：' + (e.message || (e.target && (e.target.src || e.target.href)) || '未知錯誤')); }, true);
  window.addEventListener('unhandledrejection', function (e) { if (!failed) window.__fail('載入失敗：' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(function () { if (!window.__booted && !failed) label.textContent += '（比較久，網路慢的話請再等一下）'; }, 12000);
})();
</script>
</body>
</html>
