<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brave Guy 戰鬥按鍵審稿</title><style>body{margin:24px;background:#101b18;color:#fff2cd;font:16px system-ui}main{max-width:1100px;margin:auto}section{margin:24px 0;padding:16px;border:1px solid #3fb53a;border-radius:12px}img{display:block;width:100%;height:auto;background-color:#ccc;background-image:conic-gradient(#eee 25%,transparent 0 50%,#eee 0 75%,transparent 0);background-size:24px 24px}h1{color:#ffe066}p{line-height:1.7}</style><main><h1>戰鬥按鍵素材審稿</h1><p>透明來源圖集；尚未切成正式按鍵。排列只是切圖起點，各狀態需校準中心與尺寸，避免切換時跳動。</p><section><h2>普攻</h2><p>左至右：一般、按下、不可用。</p><img src="../source/pic/icons/btn_attack_sheet.png" alt="普攻三態"></section><section><h2>閃避與變身</h2><p>上排閃避、下排變身；左至右為一般、按下、不可用。</p><img src="../source/pic/icons/btn_dodge_transform_sheet.png" alt="閃避與變身六態"></section><section><h2>四個技能</h2><p>欄：衝拳、氣功彈、震地、超勇氣波。列：一般、按下、不可用。</p><img src="../source/pic/icons/skill_buttons_sheet.png" alt="四技能各三態"></section><section><h2>搖桿與可變身狀態</h2><p>左上搖桿底座、右上搖桿旋鈕、下方變身可用發光版。實際透明度、縮放與光暈切片待驗證。</p><img src="../source/pic/ui/control_extras_sheet.png" alt="搖桿與變身發光版"></section></main></html>
