<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEMORY CRASH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 遊戲外框（手機直式比例） -->
  <div id="app" class="app">
    <div class="grid-floor"></div>
    <div class="vignette"></div>

    <!-- ========== 頂部狀態列（遊戲中顯示） ========== -->
    <header id="hud" class="hud hidden">
      <button id="btnOptionTop" class="icon-btn" aria-label="選項">
        <span class="gear">⚙</span>
      </button>
      <div class="hearts" id="hearts">
        <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
      </div>
      <div class="level-tag">LV:<span id="levelNum">1</span></div>
    </header>

    <!-- ========== 標題畫面 ========== -->
    <section id="screen-title" class="screen active">
      <button id="btnOptionTitle" class="icon-btn title-gear" aria-label="選項"><span class="gear">⚙</span></button>
      <div class="logo">
        <div class="logo-line logo-top">MEMORY</div>
        <div class="logo-line logo-bottom">CRASH</div>
      </div>
      <div class="blade" aria-hidden="true"></div>
      <button id="btnStart" class="title-start">START</button>
    </section>

    <!-- ========== 選項畫面 ========== -->
    <section id="screen-option" class="screen">
      <h2 class="banner">OPTION</h2>
      <div class="panel">
        <button id="btnHowTo" class="gold-btn">HOW TO PLAY</button>
        <button id="btnSound" class="gold-btn">SOUND <span id="soundState" class="sw-state"><span class="on">ON</span>/<span class="off">OFF</span></span></button>
        <button id="btnMusic" class="gold-btn">MUSIC <span id="musicState" class="sw-state"><span class="on">ON</span>/<span class="off">OFF</span></span></button>
        <button id="btnHome" class="gold-btn">HOME</button>
      </div>
      <button id="btnMaster" class="gold-btn master">MASTER MODE</button>
    </section>

    <!-- ========== 遊戲畫面 ========== -->
    <section id="screen-game" class="screen">
      <div id="perfectBanner" class="banner game-banner">READY</div>
      <div id="board" class="board"><!-- 寶石由 JS 產生 --></div>
      <div id="statusText" class="status-text">看好寶石發光的順序</div>
    </section>

    <!-- ========== GAME OVER 畫面 ========== -->
    <section id="screen-over" class="screen">
      <h2 class="banner gameover-banner">GAMEOVER</h2>
      <div class="over-score">
        <div>到達關卡 <b id="finalLevel">1</b></div>
        <div class="best">最佳紀錄 LV <b id="bestLevel">1</b></div>
      </div>
      <div class="panel over-panel">
        <button id="btnAgain" class="gold-btn">AGAIN</button>
        <button id="btnHomeOver" class="gold-btn">HOME</button>
      </div>
    </section>

    <!-- ========== 說明彈窗 ========== -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h3>HOW TO PLAY</h3>
        <div class="howto-steps">

          <!-- 步驟 1：記住發光順序 -->
          <div class="step">
            <div class="step-no">1</div>
            <svg class="step-thumb" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="6" y="6" width="108" height="108" rx="16" fill="#071f44" stroke="#2a5fa0"/>
              <g>
                <circle cx="36" cy="36" r="13" fill="#49c7ff" stroke="#fff" stroke-width="2"/>
                <circle cx="60" cy="60" r="11" fill="#2a456e"/>
                <circle cx="84" cy="36" r="11" fill="#2a456e"/>
                <circle cx="36" cy="84" r="11" fill="#2a456e"/>
                <circle cx="84" cy="84" r="13" fill="#ff5ea8" stroke="#fff" stroke-width="2"/>
                <circle cx="60" cy="36" r="11" fill="#2a456e"/>
                <circle cx="36" cy="60" r="11" fill="#2a456e"/>
                <circle cx="84" cy="60" r="11" fill="#2a456e"/>
                <circle cx="60" cy="84" r="13" fill="#5effa0" stroke="#fff" stroke-width="2"/>
                <text x="36" y="40" font-size="13" fill="#063" text-anchor="middle" font-weight="bold">1</text>
                <text x="60" y="88" font-size="13" fill="#063" text-anchor="middle" font-weight="bold">2</text>
                <text x="84" y="40" font-size="13" fill="#063" text-anchor="middle" font-weight="bold">3</text>
              </g>
            </svg>
            <div class="step-cap"><b>記住順序</b><br/>寶石會依序發光</div>
          </div>

          <!-- 步驟 2：照順序點回 -->
          <div class="step">
            <div class="step-no">2</div>
            <svg class="step-thumb" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="6" y="6" width="108" height="108" rx="16" fill="#071f44" stroke="#2a5fa0"/>
              <circle cx="36" cy="36" r="11" fill="#49c7ff" opacity=".6"/>
              <circle cx="60" cy="84" r="11" fill="#5effa0" opacity=".6"/>
              <circle cx="84" cy="36" r="13" fill="#ff5ea8" stroke="#fff" stroke-width="2"/>
              <path d="M36 36 L60 84 L84 36" fill="none" stroke="#ffd34e" stroke-width="3" stroke-dasharray="4 4" opacity=".8"/>
              <!-- 手指 -->
              <g transform="translate(78 44)">
                <path d="M6 0 v16 l-6 2 q-4 1 -2 5 l6 10 q2 4 7 4 h10 q5 0 6 -5 l3 -14 q1 -5 -4 -6 l-9 -2 V0 q0 -4 -4 -4 t-4 4z" fill="#ffe8c8" stroke="#8a5a2a" stroke-width="1.5"/>
              </g>
            </svg>
            <div class="step-cap"><b>照順序點</b><br/>點回剛剛發光的寶石</div>
          </div>

          <!-- 步驟 3：全對 PERFECT -->
          <div class="step">
            <div class="step-no">3</div>
            <svg class="step-thumb" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="6" y="6" width="108" height="108" rx="16" fill="#071f44" stroke="#2a5fa0"/>
              <circle cx="60" cy="54" r="30" fill="#163a1f" stroke="#5effa0" stroke-width="3"/>
              <path d="M46 55 l10 11 l20 -24" fill="none" stroke="#5effa0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="60" y="104" font-size="16" fill="#ffd34e" text-anchor="middle" font-weight="bold">PERFECT</text>
            </svg>
            <div class="step-cap"><b>全對過關</b><br/>進入下一關（更難）</div>
          </div>

          <!-- 步驟 4：小心愛心 -->
          <div class="step">
            <div class="step-no">4</div>
            <svg class="step-thumb" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="6" y="6" width="108" height="108" rx="16" fill="#071f44" stroke="#2a5fa0"/>
              <g fill="#ff3b53" stroke="#7a0016" stroke-width="2">
                <path d="M30 40 a9 9 0 0 1 14 0 a9 9 0 0 1 14 0 q3 6 -14 18 q-17 -12 -14 -18z" transform="translate(-6 0)"/>
                <path d="M30 40 a9 9 0 0 1 14 0 a9 9 0 0 1 14 0 q3 6 -14 18 q-17 -12 -14 -18z" transform="translate(22 0)"/>
                <path d="M30 40 a9 9 0 0 1 14 0 a9 9 0 0 1 14 0 q3 6 -14 18 q-17 -12 -14 -18z" transform="translate(50 0)" fill="#3a2630" stroke="#555"/>
              </g>
              <text x="60" y="96" font-size="14" fill="#ff8aa0" text-anchor="middle" font-weight="bold">點錯 −1 ♥</text>
              <text x="60" y="112" font-size="11" fill="#cfe4ff" text-anchor="middle">歸零 = GAME OVER</text>
            </svg>
            <div class="step-cap"><b>小心愛心</b><br/>點錯扣 1 顆，共 3 顆</div>
          </div>

        </div>
        <p class="howto-foot">🔥 關卡越高：順序越長、速度越快　|　⚡ MASTER MODE：更刺激</p>
        <button id="btnCloseModal" class="gold-btn small">OK，開始遊玩</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
