<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEMORY CRASH</title>
  <link rel="icon" href="assets/source/pic/branding/icon_01.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 遊戲外框（手機直式比例） -->
  <div id="app" class="app">
    <div class="grid-floor"></div>
    <div class="vignette"></div>

    <!-- ========== 頂部狀態列（遊戲中顯示） ========== -->
    <header id="hud" class="hud hidden">
      <button id="btnOptionTop" class="icon-btn" aria-label="選項">
        <span class="gear">⚙</span>
      </button>
      <div class="hearts" id="hearts">
        <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
      </div>
      <div class="level-tag" id="levelTag"></div>
    </header>

    <!-- ========== 標題畫面 ========== -->
    <section id="screen-title" class="screen active">
      <button id="btnOptionTitle" class="icon-btn title-gear" aria-label="選項"><span class="gear">⚙</span></button>
      <div class="logo">
        <img class="logo-img" src="assets/source/pic/branding/logo_01.png" alt="MEMORY CRASH" />
      </div>
      <button id="btnStart" class="title-start" aria-label="START"><img class="word start-word" src="assets/source/pic/titles/start.png" alt="START" /></button>
    </section>

    <!-- ========== 選項畫面 ========== -->
    <section id="screen-option" class="screen">
      <img class="title-word" src="assets/source/pic/titles/option.png" alt="OPTION" />
      <div class="panel">
        <button id="btnHowTo" class="gold-btn" aria-label="HOW TO PLAY"><img class="btn-word" src="assets/source/pic/titles/how_to_play.png" alt="HOW TO PLAY" /></button>
        <button id="btnSound" class="gold-btn">SOUND <span id="soundState" class="sw-state"><span class="on">ON</span>/<span class="off">OFF</span></span></button>
        <button id="btnMusic" class="gold-btn">MUSIC <span id="musicState" class="sw-state"><span class="on">ON</span>/<span class="off">OFF</span></span></button>
        <button id="btnHome" class="gold-btn" aria-label="HOME"><img class="btn-word" src="assets/source/pic/titles/home.png" alt="HOME" /></button>
      </div>
      <button id="btnMaster" class="gold-btn master" aria-label="MASTER MODE"><img class="btn-word" src="assets/source/pic/titles/master_mode.png" alt="MASTER MODE" /></button>
    </section>

    <!-- ========== 遊戲畫面 ========== -->
    <section id="screen-game" class="screen">
      <div id="perfectBanner" class="banner game-banner">READY</div>
      <div id="board" class="board"><!-- 寶石由 JS 產生 --></div>
      <div id="statusText" class="status-text">看好寶石發光的順序</div>
    </section>

    <!-- ========== GAME OVER 畫面 ========== -->
    <section id="screen-over" class="screen">
      <img class="title-word gameover-word" src="assets/source/pic/titles/gameover.png" alt="GAMEOVER" />
      <div class="over-score">
        <div>到達關卡 <b id="finalLevel">1</b></div>
        <div class="best">最佳紀錄 LV <b id="bestLevel">1</b></div>
      </div>
      <div class="panel over-panel">
        <button id="btnAgain" class="gold-btn" aria-label="AGAIN"><img class="btn-word" src="assets/source/pic/titles/again.png" alt="AGAIN" /></button>
        <button id="btnHomeOver" class="gold-btn" aria-label="HOME"><img class="btn-word" src="assets/source/pic/titles/home.png" alt="HOME" /></button>
      </div>
    </section>

    <!-- ========== 說明彈窗 ========== -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <img class="modal-word" src="assets/source/pic/titles/how_to_play.png" alt="HOW TO PLAY" />
        <div class="howto-steps">
          <div class="step">
            <div class="step-no">1</div>
            <img class="step-thumb" src="assets/source/pic/howto/step1.png" alt="" />
            <div class="step-cap"><b>記住順序</b><br/>寶石會依序發光</div>
          </div>
          <div class="step">
            <div class="step-no">2</div>
            <img class="step-thumb" src="assets/source/pic/howto/step2.png" alt="" />
            <div class="step-cap"><b>照順序點</b><br/>點回剛剛發光的寶石</div>
          </div>
          <div class="step">
            <div class="step-no">3</div>
            <img class="step-thumb" src="assets/source/pic/howto/step3.png" alt="" />
            <div class="step-cap"><b>全對過關</b><br/>進入下一關（更難）</div>
          </div>
          <div class="step">
            <div class="step-no">4</div>
            <img class="step-thumb" src="assets/source/pic/howto/step4.png" alt="" />
            <div class="step-cap"><b>小心愛心</b><br/>點錯扣 1 顆，共 3 顆</div>
          </div>
        </div>
        <p class="howto-foot">🔥 關卡越高：順序越長、速度越快　|　⚡ MASTER MODE：更刺激</p>
        <button id="btnCloseModal" class="gold-btn small">OK，開始遊玩</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
