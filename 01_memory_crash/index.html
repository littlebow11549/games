<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEMORY CRASH</title>
  <link rel="icon" href="assets/source/pic/branding/icon_01.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button id="btnExitGame" class="exit-game" type="button"><span aria-hidden="true">×</span><span id="exitGameLabel">Close game</span></button>
  <!-- 遊戲外框（手機直式比例） -->
  <div id="app" class="app">
    <div class="grid-floor"></div>
    <!-- 穿梭次元動畫（暫用 CSS 星流；正式版用 video vid_01） -->
    <div class="warp" aria-hidden="true"><span class="warp-layer"></span><span class="warp-layer l2"></span></div>
    <div class="vignette"></div>

    <!-- ========== 頂部狀態列（遊戲中顯示） ========== -->
    <header id="hud" class="hud hidden">
      <button id="btnOptionTop" class="icon-btn" aria-label="Options">
        <span class="gear">⚙</span>
      </button>
      <div class="hearts" id="hearts">
        <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
      </div>
      <div class="level-tag" id="levelTag"></div>
    </header>

    <!-- ========== 標題畫面 ========== -->
    <section id="screen-title" class="screen active">
      <button id="btnOptionTitle" class="icon-btn title-gear" aria-label="Options"><span class="gear">⚙</span></button>
      <div class="logo">
        <img class="logo-img" src="assets/source/pic/branding/logo_01.png" alt="MEMORY CRASH" />
      </div>
      <button id="btnStart" class="title-start" aria-label="START"><img class="word start-word" src="assets/source/pic/titles/start.png" alt="START" /></button>
    </section>

    <!-- ========== 主選單 ========== -->
    <section id="screen-menu" class="screen">
      <img class="menu-logo" src="assets/source/pic/branding/logo_01.png" alt="MEMORY CRASH" />
      <div class="mascot menu-char" data-mascot role="img" aria-label="Space Pug"><canvas width="280" height="320" aria-hidden="true"></canvas></div>
      <div class="panel menu-panel">
        <button id="btnArcade" class="gold-btn" aria-label="ARCADE"><span class="menu-word" data-word="ARCADE" aria-hidden="true"></span></button>
        <button id="btnContinue" class="gold-btn" aria-label="CONTINUE"><span class="menu-word" data-word="CONTINUE" aria-hidden="true"></span></button>
        <button id="btnMenuOption" class="gold-btn">OPTION</button>
        <button id="btnExit" class="gold-btn" aria-label="EXIT"><span class="menu-word" data-word="EXIT" aria-hidden="true"></span></button>
      </div>
    </section>

    <!-- ========== 選項畫面 ========== -->
    <section id="screen-option" class="screen">
      <img class="title-word" src="assets/source/pic/titles/option.png" alt="OPTION" />
      <div class="panel">
        <button id="btnHowTo" class="gold-btn" aria-label="HOW TO PLAY"><img class="btn-word" src="assets/source/pic/titles/how_to_play.png" alt="HOW TO PLAY" /></button>
        <button id="btnSound" class="gold-btn">SOUND <span id="soundState" class="sw-state"><span class="on">ON</span>/<span class="off">OFF</span></span></button>
        <button id="btnMusic" class="gold-btn">MUSIC <span id="musicState" class="sw-state"><span class="on">ON</span>/<span class="off">OFF</span></span></button>
        <button id="btnHome" class="gold-btn" aria-label="HOME"><img class="btn-word" src="assets/source/pic/titles/home.png" alt="HOME" /></button>
      </div>
      <button id="btnMaster" class="gold-btn master" aria-label="MASTER MODE"><img class="btn-word" src="assets/source/pic/titles/master_mode.png" alt="MASTER MODE" /></button>
    </section>

    <!-- ========== 遊戲畫面 ========== -->
    <section id="screen-game" class="screen">
      <div id="scoreTag" class="score-tag">★ <span id="scoreNum">0</span></div>
      <div id="perfectBanner" class="banner game-banner">READY</div>
      <div id="comboPop" class="combo-pop" aria-hidden="true"></div>
      <div id="timerBar" class="timer-bar" aria-hidden="true"><span id="timerFill" class="timer-fill"></span></div>
      <div id="board" class="board"><!-- 寶石由 JS 產生 --></div>
      <div class="game-reaction"><div class="mascot game-char" data-mascot role="img" aria-label="Space Pug"><canvas width="280" height="320" aria-hidden="true"></canvas></div><div id="statusText" class="status-text">Watch the gems light up</div></div>
    </section>

    <!-- ========== GAME OVER 畫面 ========== -->
    <section id="screen-over" class="screen">
      <img class="title-word gameover-word" src="assets/source/pic/titles/gameover.png" alt="GAMEOVER" />
      <div class="mascot over-char" data-mascot role="img" aria-label="Space Pug"><canvas width="280" height="320" aria-hidden="true"></canvas></div>
      <div class="over-score">
        <div class="score-big">★ <b id="finalScore">0</b></div>
        <div><span id="reachedLabel">Reached level</span> <b id="finalLevel">1</b></div>
        <div class="best"><span id="bestScoreLabel">Best score</span> <b id="bestScore">0</b> · <span id="bestLvLabel">Best LV</span> <b id="bestLevel">1</b></div>
      </div>
      <div class="panel over-panel">
        <button id="btnAgain" class="gold-btn" aria-label="AGAIN"><img class="btn-word" src="assets/source/pic/titles/again.png" alt="AGAIN" /></button>
        <button id="btnHomeOver" class="gold-btn" aria-label="HOME"><img class="btn-word" src="assets/source/pic/titles/home.png" alt="HOME" /></button>
      </div>
    </section>

    <!-- ========== 說明彈窗 ========== -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <img class="modal-word" src="assets/source/pic/titles/how_to_play.png" alt="HOW TO PLAY" />
        <div class="howto-steps">
          <div class="step">
            <div class="step-no">1</div>
            <img class="step-thumb" src="assets/source/pic/howto/step1.png" alt="" />
            <div class="step-cap"><b>Memorize</b><br/>Gems light up in order</div>
          </div>
          <div class="step">
            <div class="step-no">2</div>
            <img class="step-thumb" src="assets/source/pic/howto/step2.png" alt="" />
            <div class="step-cap"><b>Tap in order</b><br/>Tap the gems you saw</div>
          </div>
          <div class="step">
            <div class="step-no">3</div>
            <img class="step-thumb" src="assets/source/pic/howto/step3.png" alt="" />
            <div class="step-cap"><b>Clear it</b><br/>All correct = next level</div>
          </div>
          <div class="step">
            <div class="step-no">4</div>
            <img class="step-thumb" src="assets/source/pic/howto/step4.png" alt="" />
            <div class="step-cap"><b>Mind your hearts</b><br/>Wrong tap -1, 3 total</div>
          </div>
        </div>
        <p class="howto-foot">🔥 Higher level = longer &amp; faster  |  ⚡ MASTER MODE: tougher</p>
        <button id="btnCloseModal" class="gold-btn small">OK, Let's Play</button>
      </div>
    </div>
  </div>

  <script src="js/mascot.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
