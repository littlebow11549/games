<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巴哥待機連續圖</title>
<style>body{margin:0;background:#06172d;color:#eff8ff;font:16px/1.6 system-ui;text-align:center}main{max-width:900px;margin:auto;padding:24px}canvas{display:block;width:min(90vw,440px);height:auto;margin:auto}img{width:100%;height:auto}button{padding:12px 24px;background:#ffe17a;border:0;border-radius:9px;font:inherit}p{color:#b5cce2}</style>
<main><h1>太空巴哥 · 待機循環</h1><p>輕呼吸 → 眨眼 → 放鬆 → 回到原姿勢。8 個繪製關鍵幀，3 秒循環。</p><div id="player"><canvas data-hero-idle width="444" height="444" role="img" aria-label="巴哥呼吸眨眼待機動畫"></canvas></div><button id="pause">暫停 / 顯示圖集</button><p>播放器以時間驅動、過渡混合；非 60 張逐格繪製。減少動態設定下停在第一格。</p><img src="../runtime/pic/batch3/pug_idle_01.webp" alt="四欄兩列的八格待機連續圖"></main>
<script src="../../js/hero-idle.js"></script><script>document.querySelector('#pause').onclick=()=>{const p=document.querySelector('#player');p.hidden=!p.hidden;};</script></html>
