<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <defs>
    <radialGradient id="helm" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#eafaff" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#bfe9ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5ab6ff" stop-opacity=".25"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/><stop offset="100%" stop-color="#c3d6f0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d6a8"/><stop offset="100%" stop-color="#d9b47e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe17a"/><stop offset="100%" stop-color="#e88a12"/>
    </linearGradient>
  </defs>

  <!-- 身體 / 太空衣 -->
  <g>
    <ellipse cx="150" cy="300" rx="78" ry="52" fill="url(#suit)" stroke="#8aa6cc" stroke-width="3"/>
    <!-- 手插腰（痞痞） -->
    <path d="M78 290 q-34 -6 -40 -34 q18 8 40 10z" fill="url(#suit)" stroke="#8aa6cc" stroke-width="3"/>
    <path d="M222 290 q34 -6 40 -34 q-18 8 -40 10z" fill="url(#suit)" stroke="#8aa6cc" stroke-width="3"/>
    <!-- 胸口金星徽章（正義感） -->
    <circle cx="150" cy="300" r="22" fill="#0b3f7a" stroke="#49c7ff" stroke-width="3"/>
    <path d="M150 286 l5 10 11 1 -8 8 2 11 -10 -6 -10 6 2 -11 -8 -8 11 -1z" fill="url(#gold)"/>
  </g>

  <!-- 頭 -->
  <g>
    <!-- 耳朵 -->
    <path d="M86 150 q-20 6 -16 42 q16 -8 30 -20z" fill="#5a4632"/>
    <path d="M214 150 q20 6 16 42 q-16 -8 -30 -20z" fill="#5a4632"/>
    <!-- 臉 -->
    <circle cx="150" cy="150" r="74" fill="url(#fur)" stroke="#b98f52" stroke-width="2"/>
    <!-- 黑色面罩紋（巴哥特徵） -->
    <path d="M150 196 q-46 2 -52 -40 q26 20 52 18 q26 2 52 -18 q-6 42 -52 40z" fill="#3a2f28"/>
    <!-- 皺褶 -->
    <path d="M128 120 q22 10 44 0" fill="none" stroke="#b98f52" stroke-width="3" stroke-linecap="round"/>
    <!-- 眼睛（大、亮） -->
    <circle cx="124" cy="132" r="17" fill="#fff"/><circle cx="176" cy="132" r="17" fill="#fff"/>
    <circle cx="127" cy="135" r="10" fill="#241a12"/><circle cx="173" cy="135" r="10" fill="#241a12"/>
    <circle cx="131" cy="131" r="3.5" fill="#fff"/><circle cx="177" cy="131" r="3.5" fill="#fff"/>
    <!-- 痞痞挑眉 -->
    <path d="M110 112 q16 -8 30 -2" fill="none" stroke="#3a2f28" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 110 q16 -6 30 2" fill="none" stroke="#3a2f28" stroke-width="4" stroke-linecap="round"/>
    <!-- 鼻 + 壞笑 -->
    <ellipse cx="150" cy="162" rx="12" ry="8" fill="#241a12"/>
    <path d="M132 176 q18 16 40 2" fill="none" stroke="#241a12" stroke-width="4" stroke-linecap="round"/>
    <path d="M168 180 q6 4 12 1" fill="none" stroke="#241a12" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 太空頭盔玻璃 -->
  <circle cx="150" cy="140" r="98" fill="url(#helm)" stroke="#8fe0ff" stroke-width="4" opacity=".55"/>
  <path d="M96 92 q34 -30 78 -20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".6"/>
  <!-- 頭盔金邊環 -->
  <path d="M60 196 a98 70 0 0 0 180 0" fill="none" stroke="url(#gold)" stroke-width="9"/>
</svg>
