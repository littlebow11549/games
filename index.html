<main id="main">
<section class="hero" aria-labelledby="hero-title">
<div>
<div class="eyebrow">SMALL GAMES. BIG MOMENTS.</div>
<h1 id="hero-title">給日常一點<br><em>遊戲時間。</em></h1>
<p class="intro">把忙碌暫停，讓玩心上線。<br>一點專注、一點挑戰，下一個紀錄由你創造。</p>
<div class="actions"><a class="button primary" href="01_memory_crash/">開始挑戰 <span aria-hidden="true">↗</span></a><a class="text-link" href="#games">探索遊戲 <span aria-hidden="true">↓</span></a></div>
<div class="hero-note"><span aria-hidden="true"></span>免下載，打開就能玩<span aria-hidden="true"></span>手機・電腦皆適用</div>
</div>
<div>
<a class="artwork" style="display:block" href="01_memory_crash/" aria-label="開始遊玩 Memory Crash">
<div class="art-label"><span class="live-dot" aria-hidden="true"></span>本期精選 / FEATURED</div><div class="edition">NO. 001</div>
<img class="game-logo" src="01_memory_crash/assets/source/pic/branding/logo_01.png" width="1422" height="1106" alt="Memory Crash" fetchpriority="high">
<span class="gem gem-one" aria-hidden="true"></span><span class="gem gem-two" aria-hidden="true"></span><span class="gem gem-three" aria-hidden="true"></span>

</a>

</section>

<footer><span class="footer-brand">GAME HUB<span style="color:var(--gold)">.</span></span><span class="footer-note">為每一個想玩一下的時刻。</span><span>© 2026 GAME HUB</span></footer>
</div>
<script>
// 新增遊戲時在此加入資料；ready 顯示可玩卡片，soon 顯示預告。
const GAMES=[{folder:'01_memory_crash',name:'Memory Crash',desc:'記住寶石的發光順序，重現你的完美記憶。',icon:'01_memory_crash/assets/source/pic/branding/icon_01.png',tags:['記憶挑戰','益智'],status:'ready'}];
const grid=document.getElementById('grid');
GAMES.forEach(game=>{
 const ready=game.status==='ready';
 const card=document.createElement(ready?'a':'article');
 card.className='game-card';
 if(ready){card.href=game.folder+'/';card.setAttribute('aria-label','開始遊玩 '+game.name);}
 const image=document.createElement('img');image.className='game-icon';image.src=game.icon;image.alt='';image.width=104;image.height=104;image.loading='lazy';card.append(image);
 const body=document.createElement('div');const tags=document.createElement('div');tags.className='tags';
 (game.tags||[]).forEach(label=>{const tag=document.createElement('span');tag.className='tag';tag.textContent=label;tags.append(tag);});
 if(!ready){const tag=document.createElement('span');tag.className='tag';tag.textContent='開發中';tags.append(tag);}
 const title=document.createElement('h3');title.textContent=game.name;const desc=document.createElement('p');desc.textContent=game.desc;body.append(tags,title,desc);card.append(body);
 if(ready){const arrow=document.createElement('span');arrow.className='card-arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');card.append(arrow);}grid.append(card);
});
document.getElementById('game-count').textContent=String(GAMES.length).padStart(2,'0');
const soon=document.createElement('article');soon.className='soon';soon.innerHTML='<span class="soon-plus" aria-hidden="true">＋</span><div><span class="small">NEXT UP</span><h3>下一份樂趣，準備中。</h3><p>更多新挑戰，將在這裡與你見面。</p></div>';grid.append(soon);
</script>
