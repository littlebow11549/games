<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8格擊中動效預覽</title><style>body{background:#101722;color:#ffe090;font:16px system-ui;text-align:center;margin:24px}#spark{width:min(80vw,380px);aspect-ratio:1;margin:24px auto;background-image:url('assets/source/pic/fx/fx_hit_arcade_8f.png');background-size:400% 200%}button{padding:12px 24px;font:inherit}#strip{display:grid;grid-template-columns:repeat(4,1fr);max-width:900px;margin:auto}figure{margin:8px}figure div{aspect-ratio:1;background-image:url('assets/source/pic/fx/fx_hit_arcade_8f.png');background-size:400% 200%}a{color:#caff98}</style><h1>8 格街機擊中火花</h1><p>40 fps · 單次約 0.2 秒 · 白閃→爆開→碎片消散</p><button id="play">播放一次</button><div id="spark"></div><div id="strip"></div><p><a href="play.html">回遊戲測試</a></p><script>const paint=(el,i)=>el.style.backgroundPosition=`${i%4*100/3}% ${Math.floor(i/4)*100}%`;for(let i=0;i<8;i++){const f=document.createElement('figure'),d=document.createElement('div'),c=document.createElement('figcaption');paint(d,i);c.textContent='第 '+(i+1)+' 格';f.append(d,c);strip.append(f)}let raf;play.onclick=()=>{cancelAnimationFrame(raf);spark.style.visibility='visible';const start=performance.now();function tick(now){const frame=Math.floor((now-start)/25);if(frame>=8){spark.style.visibility='hidden';return}paint(spark,frame);raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)};paint(spark,2);</script></html>
