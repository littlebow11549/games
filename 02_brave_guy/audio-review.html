<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勇氣超人｜音樂音效檢核</title>
<style>body{margin:0;background:#081a13;color:#edf5df;font:16px system-ui;line-height:1.6}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:26px}a{color:#ffdf65}header{position:sticky;top:0;background:#081a13f5;padding:12px 0;z-index:2}input[type=search]{padding:12px;width:min(100%,480px);box-sizing:border-box;border-radius:8px}article{border:1px solid #486c46;border-radius:12px;padding:18px;margin:14px 0;background:#10291e}h2{font-size:18px;margin:0 0 8px}p{margin:6px 0;color:#c0d3bb}audio{display:block;width:100%;max-width:520px;margin:10px 0}select,button{padding:8px;border-radius:6px;font:inherit}small{overflow-wrap:anywhere}#summary{color:#ffdf65}</style>
<main><h1>勇氣超人・音樂／音效檢核</h1><p>用編號或用途告訴我要替換哪一項。B 為 BGM，S 為音效；每次只播放一段，不會自動播放。</p><p>共用音檔與停用舊版會另外標示。檢核選擇只保存在這個瀏覽器，不影響遊戲進度。</p><header><input type="search" id="search" placeholder="搜尋編號、名稱或用途" aria-label="搜尋音訊"><button id="stop">全部停止</button><div id="summary"></div></header><div id="list">載入中…</div></main>
<script>
(async()=>{const data=await(await fetch('assets/audio-catalog.json?v=20261118brave')).json();const list=document.querySelector('#list');list.replaceChildren();let saved={};try{saved=JSON.parse(localStorage.getItem('brave-audio-review-v1')||'{}')}catch{}
const owners=new Map();data.forEach(r=>r.files.forEach(f=>owners.set(f,[...(owners.get(f)||[]),r.id])));
for(const r of data){const el=document.createElement('article');el.id=r.id;el.dataset.search=(r.id+' '+r.name+' '+r.key).toLowerCase();const title=document.createElement('h2');title.textContent=r.id+'｜'+r.name;el.append(title);const info=document.createElement('p');info.textContent=r.status;el.append(info);
for(const [i,file]of r.files.entries()){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';const source=document.createElement('source');source.src=file;audio.append(source);if(file.endsWith('.ogg')){const fallback=document.createElement('source');fallback.src=file.replace(/\.ogg$/,'.mp3');audio.append(fallback)}audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause()}));el.append(audio);const link=document.createElement('a');link.href=file;link.textContent='開啟音檔'+(r.files.length>1?' '+(i+1):'');el.append(link);const note=document.createElement('p');note.textContent=owners.get(file).length>1?'共用同一音檔：'+owners.get(file).join('、'):'獨立音檔';el.append(note);}
const label=document.createElement('label');label.textContent='檢核結果：';const select=document.createElement('select');select.setAttribute('aria-label',r.id+'檢核結果');for(const v of ['未檢核','保留','要替換']){const option=document.createElement('option');option.textContent=v;select.append(option)}select.value=saved[r.id]||'未檢核';select.onchange=()=>{saved[r.id]=select.value;try{localStorage.setItem('brave-audio-review-v1',JSON.stringify(saved))}catch{}};label.append(select);el.append(label);list.append(el)}
document.querySelector('#summary').textContent='38 首 BGM・88 個音效槽位（含共用音檔與停用舊版）';document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase().trim();list.querySelectorAll('article').forEach(el=>el.hidden=!el.dataset.search.includes(q))};document.querySelector('#stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();})().catch(()=>document.querySelector('#list').textContent='清單載入失敗，請重新整理。');
</script></html>
