<script>
// 讀取進度條與錯誤提示。這段不依賴模組，所以主程式還沒下載完就能顯示。
(function () {
  var note = document.getElementById('ov-load');
  var bar = document.getElementById('loadbar'), fill = document.getElementById('loadbar-fill'), label = document.getElementById('loadbar-text');
  var pct = 0, failed = false;
  var locale=new URLSearchParams(location.search).get('lang');try{locale=locale||localStorage.getItem('braveguy.lang');}catch(e){}
  var language=locale==='en'?1:locale==='ja'?2:0;
  var tips=[['20 連擊：攻擊提升 25%','20-hit combo: +25% damage','20 コンボ：攻撃力 25% アップ'],['完美閃避：3 秒反擊增傷 50%','Perfect dodge: +50% damage for 3 seconds','ジャスト回避：3 秒間ダメージ 50% アップ'],['魔王久戰會加速，抓住出招後的破綻','Bosses accelerate in long fights. Punish openings.','長期戦ではボスが加速。攻撃後の隙を狙おう。']];
  var tipIndex=0;function tip(){document.getElementById('boot-tip').textContent=tips[tipIndex++%tips.length][language];}tip();
  var tipTimer=setInterval(function(){if(window.__booted||failed)clearInterval(tipTimer);else tip();},4500);
  document.getElementById('boot-retry').onclick=function(){location.reload();};

  // 進度只會往前，不會倒退
  window.__progress = function (value, text) {
    if (failed) return;
    pct = Math.max(pct, Math.min(100, value));
    fill.style.width = pct + '%';
    document.getElementById('boot-fill').style.transform='scaleX('+pct/100+')';
    document.getElementById('boot-percent').textContent=Math.round(pct)+'%';
    document.getElementById('boot-caption').textContent=pct<76?['喚醒勇氣，準備內心世界…','Awakening courage. Preparing your inner world…','勇気を呼び覚まし、心の世界を準備中…'][language]:text;
    label.textContent = (text || '讀取中') + '　' + Math.round(pct) + '%';
    if (pct >= 100) setTimeout(function () { bar.hidden = true; label.hidden = true; }, 400);
  };

  // 3%–55%：3D 引擎（最大的檔案，佔全部程式的九成）。邊下載邊依實際位元組數推進。
  // 下載完才載入主程式；主程式匯入同一個網址時會直接用瀏覽器快取，不會重抓。
  var ENGINE = 'vendor/three/three.module.min.js', ENGINE_BYTES = 691648;
  function startGame() {
    var s = document.createElement('script');
    s.type = 'module';
    s.src = 'js/main.js?v=20261126dragon';
    document.body.appendChild(s);
  }
  window.__progress(3, '開始讀取');
  (function loadEngine() {
    if (!window.fetch || !window.ReadableStream) { startGame(); return; }
    fetch(ENGINE).then(function (res) {
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      var reader = res.body.getReader(), got = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          got += r.value.length;
          window.__progress(3 + Math.min(1, got / ENGINE_BYTES) * 52, '下載 3D 引擎');
          return pump();
        });
      })();
    }).then(function () { window.__progress(55, '下載遊戲程式'); startGame(); })
      .catch(function () { startGame(); }); // 進度抓不到也照樣啟動，讓模組載入自己處理錯誤
  })();

  // 55%–60%：其餘的小檔案，每下載完一個前進一格
  var files = ['main.js', 'i18n.js', 'lang_en.js', 'maze.js', 'world.js', 'visuals.js', 'fx.js', 'input.js', 'audio.js', 'story.js'];
  var done = {};
  function seen(url) {
    for (var i = 0; i < files.length; i++) {
      if (url.indexOf('/' + files[i]) !== -1 && !done[files[i]]) {
        done[files[i]] = true;
        if (done['main.js']) window.__progress(55 + Object.keys(done).length / files.length * 5, '下載遊戲程式');
      }
    }
  }
  try {
    new PerformanceObserver(function (list) { list.getEntries().forEach(function (e) { seen(e.name); }); }).observe({ type: 'resource', buffered: true });
  } catch (err) { /* 不支援就只顯示主程式回報的進度 */ }

  // 出問題時要讓玩家看得到原因，而不是永遠停在讀取中
  window.__fail = function (html) {
    if (window.__booted) return;
    failed = true;
    clearInterval(tipTimer);
    document.getElementById('boot-caption').textContent=['載入未完成，請重試。','Loading incomplete. Please retry.','読み込みが完了していません。再試行してください。'][language];
    document.getElementById('boot-retry').hidden=false;
    bar.hidden = true; label.hidden = true;
    note.textContent = html;
    note.innerHTML += '<br><a href="#" id="ov-reload" style="color:#f6c21c">重新載入</a>';
    note.style.opacity = 1;
    document.getElementById('ov-reload').onclick = function (e) { e.preventDefault(); location.replace(location.pathname + '?r=' + Date.now()); };
  };
  window.addEventListener('error', function (e) { if (!failed) window.__fail('載入失敗：' + (e.message || (e.target && (e.target.src || e.target.href)) || '未知錯誤')); }, true);
  window.addEventListener('unhandledrejection', function (e) { if (!failed) window.__fail('載入失敗：' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(function () { if (!window.__booted && !failed) label.textContent += '（比較久，網路慢的話請再等一下）'; }, 12000);
})();
</script>
